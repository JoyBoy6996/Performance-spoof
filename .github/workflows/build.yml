name: Build APK

on:
  push:
    branches:
      - main
      - master
      - hyperos
      - coloros
      - 'port/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Raise the Gradle heap
        # The committed value is sized for a small sandbox. CI has more room,
        # and the Compose compiler plus the dex merge want it.
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          cat gradle.properties

      - name: Install the Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify the APK identity
        run: |
          set -e
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/app-*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "::group::$(basename "$apk")"
            "$AAPT" dump badging "$apk" | grep -F "package: name='com.antutu.ABenchMark'"
            "$AAPT" dump xmltree "$apk" AndroidManifest.xml > manifest-tree.txt
            grep -F "com.antutu.ABenchMark.MainActivity" manifest-tree.txt
            grep -F "com.antutu.ABenchMark.PerformanceService" manifest-tree.txt
            echo "::endgroup::"
          done

      # Artifact names may not contain a slash, and the branch names here are
      # of the form port/<rom>, so flatten them.
      - name: Resolve the artifact name
        run: echo "ARTIFACT_NAME=PerformanceSpoof-$(echo '${{ github.ref_name }}' | tr '/' '-' | tr -cd '[:alnum:]._-')" >> "$GITHUB_ENV"

      - name: Upload the APKs
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/outputs/apk/*/app-*.apk
          if-no-files-found: error

      - name: Upload the manifest verification
        uses: actions/upload-artifact@v5
        with:
          name: manifest-verification-${{ env.ARTIFACT_NAME }}
          path: manifest-tree.txt
          if-no-files-found: warn

      # Release assets on a public repository can be fetched without a token,
      # which makes the built APK downloadable straight from the Releases page.
      - name: Publish the APKs as a release
        if: startsWith(github.ref, 'refs/heads/port/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ci-${{ env.ARTIFACT_NAME }}"
          notes="$(ls -1 app/build/outputs/apk/*/app-*.apk | while read -r f; do
            echo "### $(basename "$f")"
            echo
            echo '```'
            sha256sum "$f"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$f" | head -3
            echo '```'
            echo
          done)"
          notes="$notes"'
          ---
          Built from `'"$GITHUB_SHA"'` on `'"$GITHUB_REF_NAME"'` by the Build APK workflow.'
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" app/build/outputs/apk/*/app-*.apk --clobber
            gh release edit "$tag" --title "Performance Spoof - ${{ github.ref_name }}" --notes "$notes"
          else
            gh release create "$tag" app/build/outputs/apk/*/app-*.apk \
              --title "Performance Spoof - ${{ github.ref_name }}" \
              --notes "$notes" --target "$GITHUB_SHA"
          fi
          echo "release tag: $tag"
