# Reduced heap because the sandbox/CI runners for this project are memory
# constrained. The dex merge step for the reconstructed dependency set is the
# heaviest part of the build.
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
