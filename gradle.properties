# The dex merge and the Compose compiler are the two heavy steps. The build
# runs inside a 3 GB sandbox, so the heap is capped and the Kotlin compiler
# runs in-process instead of spawning a second daemon.
org.gradle.jvmargs=-Xmx1600m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
